[package]
name = "bibox"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bibox"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
dirs = "5"
toml = "0.8"
crossterm = "0.28"
ratatui = "0.29"
arboard = "3"
regex = "1"
scraper = "0.22"
urlencoding = "2"
zip = "2"
