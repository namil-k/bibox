api = 1
name = "summarize"
version = "0.1.0"
description = "Summarize the attached PDF into the note with Claude"
run = "python3 main.py"

[[commands]]
id = "summarize"
desc = "Summarize the PDF into the note"
key = "S"
menu = true

[[settings]]
key = "model"
type = "choice"
choices = ["claude-opus-5", "claude-sonnet-5"]
default = "claude-opus-5"
desc = "Claude model for the summary"

[[settings]]
key = "max_tokens"
type = "int"
default = 4000
desc = "Longest summary Claude may write"
