api = 2
name = "library-proxy"
version = "0.1.0"
description = "Open entries through your library proxy or link resolver"
run = "python3 main.py"
guide = "AGENT.md"

[[commands]]
id = "open"
desc = "Open the entry through your library proxy or link resolver (the first link)"
key = "u"
menus = ["context"]

[[commands]]
id = "choose"
desc = "Pick which library link to open the entry through"
key = "v"
menus = ["context"]

[[commands]]
id = "find"
desc = "Find your library by name and make it the default"
menus = ["context"]

[[commands]]
id = "links"
desc = "Manage library links: add, reorder, remove"
menus = ["context"]

[[settings]]
key = "link1"
type = "string"
default = ""
desc = "Your library (u opens through this one): a prefix such as https://ezproxy.example.edu/login?url= or a template with {url}, {url_encoded} or {doi}"

[[settings]]
key = "link2"
type = "string"
default = ""
desc = "Another library, in order of preference (v picks): a prefix such as https://ezproxy.example.edu/login?url= or a template with {url}, {url_encoded} or {doi}"

[[settings]]
key = "link3"
type = "string"
default = ""
desc = "Another library, in order of preference (v picks): a prefix such as https://ezproxy.example.edu/login?url= or a template with {url}, {url_encoded} or {doi}"

[[settings]]
key = "link4"
type = "string"
default = ""
desc = "Another library, in order of preference (v picks): a prefix such as https://ezproxy.example.edu/login?url= or a template with {url}, {url_encoded} or {doi}"

[[settings]]
key = "link5"
type = "string"
default = ""
desc = "Another library, in order of preference (v picks): a prefix such as https://ezproxy.example.edu/login?url= or a template with {url}, {url_encoded} or {doi}"

[cli]
run = "python3 main.py"
