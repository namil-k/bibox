api = 2
name = "library-proxy"
version = "0.1.0"
description = "Open entries through your library proxy or link resolver"
run = "python3 main.py"
guide = "AGENT.md"

[[commands]]
id = "open"
desc = "Open through your library (link1)"
help = "Opens the selected entries in the browser through link1. Log in there; bibox never fetches through the proxy itself."
key = "u"
menus = ["context"]

[[commands]]
id = "choose"
desc = "Open through a library you pick"
help = "Shows link1 to link5 and opens through the one you pick. The last item, Manage links, reorders them."
key = "v"
menus = ["context"]

[[commands]]
id = "find"
desc = "Find your library by name"
help = "Searches a directory of 2,000 library proxies and link resolvers by name or country and saves the match as link1."
menus = ["context", "settings"]

[[commands]]
id = "links"
desc = "Manage links: order, add, remove"
help = "Lists link1 to link5; pick one to make it the default, move it up or down, or remove it. Add by hand or from the directory."
menus = ["context", "settings"]

[[settings]]
key = "link1"
type = "string"
default = ""
desc = "Your library (u opens through this one): a prefix such as https://ezproxy.example.edu/login?url= or a template with {url}, {url_encoded} or {doi}"

[[settings]]
key = "link2"
type = "string"
default = ""
desc = "Another library, in order of preference (v picks): a prefix such as https://ezproxy.example.edu/login?url= or a template with {url}, {url_encoded} or {doi}"

[[settings]]
key = "link3"
type = "string"
default = ""
desc = "Another library, in order of preference (v picks): a prefix such as https://ezproxy.example.edu/login?url= or a template with {url}, {url_encoded} or {doi}"

[[settings]]
key = "link4"
type = "string"
default = ""
desc = "Another library, in order of preference (v picks): a prefix such as https://ezproxy.example.edu/login?url= or a template with {url}, {url_encoded} or {doi}"

[[settings]]
key = "link5"
type = "string"
default = ""
desc = "Another library, in order of preference (v picks): a prefix such as https://ezproxy.example.edu/login?url= or a template with {url}, {url_encoded} or {doi}"

[cli]
run = "python3 main.py"
