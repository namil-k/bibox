api = 2
name = "proxy"
version = "0.1.0"
description = "Open entries through your library proxy or link resolver"
run = "python3 main.py"
guide = "AGENT.md"

[[commands]]
id = "open"
desc = "Open the entry through your library proxy or link resolver (the first link)"
key = "u"
menus = ["context"]

[[commands]]
id = "choose"
desc = "Pick which library link to open the entry through"
key = "v"
menus = ["context"]

[[commands]]
id = "find"
desc = "Find your library by name and make it the default"
menus = ["context"]

[[settings]]
key = "links"
type = "string"
default = ""
desc = "Library proxy links, one per line, first is the default: a prefix (https://ezproxy.example.edu/login?url=) or a template with {url}, {url_encoded} or {doi}"

[cli]
run = "python3 main.py"
